const baseTranslate=translate;
function translateFor(s){if(lang==='ru')return s;const english=baseTranslate(s);if(lang==='en')return english;const dict=localized[lang]||{};const clean=english.trim();if(Object.prototype.hasOwnProperty.call(dict,clean))return english.replace(clean,dict[clean]);let result=english;for(const [k,v] of Object.entries(dict).sort((a,b)=>b[0].length-a[0].length)){if(k.length>=9&&result.includes(k))result=result.split(k).join(v)}return result;}
function apply(){
if(busy)return;busy=true;
const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
while(n=walker.nextNode()){if(!n.parentElement||['SCRIPT','STYLE','TEXTAREA','OPTION'].includes(n.parentElement.tagName)&&n.parentElement.tagName!=='OPTION')continue;
if(!source.has(n))source.set(n,n.nodeValue);
const original=source.get(n);const wanted=lang==='ru'?original:translateFor(original);if(n.nodeValue!==wanted)n.nodeValue=wanted;
}
document.querySelectorAll('[placeholder],[title]').forEach(el=>{for(const a of ['placeholder','title']){if(!el.hasAttribute(a))continue;const key='i18nOriginal'+a;if(!el.dataset[key])el.dataset[key]=el.getAttribute(a);el.setAttribute(a,lang==='ru'?el.dataset[key]:translateFor(el.dataset[key]));}});
document.documentElement.lang=lang;
document.querySelectorAll('.lang-switch button').forEach(b=>{b.classList.toggle('selected',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});
busy=false;
}
const host=document.querySelector('.top .flex')||document.querySelector('header .wrap')||document.querySelector('header nav')||document.querySelector('header');
if(host){const el=document.createElement('span');el.className='lang-switch';el.setAttribute('aria-label','Language');el.innerHTML='<button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="es">ES</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="fr">FR</button><button type="button" data-lang="de">DE</button>';host.prepend(el);el.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('inforepacker-language',lang)}catch(e){}apply()});}
const observer=new MutationObserver(()=>{if(!busy){observer.disconnect();apply();observer.observe(document.body,{subtree:true,childList:true,characterData:true})}});
apply();observer.observe(document.body,{subtree:true,childList:true,characterData:true});
})();
